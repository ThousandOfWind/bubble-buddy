name: Tests

# Runs the unittest suite on every push and pull request. The suite pulls in
# Windows-only dependencies (uiautomation for focus detection, PySide6 for the
# Qt overlay), so the full suite runs on windows-latest. A focused macOS job
# checks native AppKit imports, desktop routing and the shared Copilot transport;
# its tests do not record audio, open windows, or call real cloud inference.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv (+ Python 3.11)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      # Keep bootstrap mocks/filesystem cases out of the GUI test interpreter.
      # Both separate process exits gate this same unittest job.
      - name: Run standalone bootstrap cases
        run: uv run --no-sync python -m unittest discover -s tests -p install_from_index_cases.py -v

      - name: Run unittest suite
        run: uv run --no-sync python -m unittest discover -s tests -v

  macos-compatibility:
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv (+ Python 3.11)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Import real native macOS frontend
        run: uv run --no-sync python -c "from bubble_buddy import overlay, copilot_client; print('AppKit frontend and Copilot transport imported')"

      - name: Run focused compatibility tests (no mic or cloud calls)
        run: |
          uv run --no-sync python -m unittest discover -s tests -p test_mac_performance.py -v
          uv run --no-sync python -m unittest discover -s tests -p test_copilot_auth.py -v
          uv run --no-sync python -m unittest discover -s tests -p test_cli.py -v
